[project]
name = "pdf2md"
version = "0.1.0"
description = "Born-digital PDF to Markdown (pymupdf4llm + code-spacing fixes)"
requires-python = ">=3.12"
dependencies = [
  "pymupdf4llm==1.28.2",
  "pymupdf-layout==1.28.2",
]

[project.scripts]
pdf2md = "pdf2md:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pdf2md.py"]
